services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pmo
      POSTGRES_PASSWORD: pmo_local_only
      POSTGRES_DB: pmo_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmo -d pmo_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    # All governance settings (limits, kill switch, tokens) come from .env.
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pmo:pmo_local_only@db:5432/pmo_agent
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
